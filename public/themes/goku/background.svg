<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#030a1c"/>
      <stop offset="0.5" stop-color="#0c2452"/>
      <stop offset="0.82" stop-color="#1e4f96"/>
      <stop offset="1" stop-color="#4aa0f0"/>
    </linearGradient>
    <radialGradient id="aura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd75e" stop-opacity="0.9"/>
      <stop offset="0.35" stop-color="#ffb020" stop-opacity="0.55"/>
      <stop offset="0.7" stop-color="#ff8a00" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ff8a00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dragonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mountain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1730"/>
      <stop offset="1" stop-color="#040a18"/>
    </linearGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- stars up top -->
  <g fill="#dbeafe" opacity="0.8">
    <circle cx="120" cy="80" r="1.6"/>
    <circle cx="330" cy="140" r="1.2"/>
    <circle cx="520" cy="60" r="1.8"/>
    <circle cx="760" cy="110" r="1.2"/>
    <circle cx="980" cy="70" r="1.5"/>
    <circle cx="1450" cy="120" r="1.4"/>
    <circle cx="1520" cy="50" r="1.2"/>
    <circle cx="230" cy="210" r="1"/>
    <circle cx="640" cy="190" r="1.1"/>
    <circle cx="1180" cy="160" r="1.3"/>
  </g>

  <!-- dramatic cloud layers -->
  <g fill="#0b1d40" opacity="0.85">
    <path d="M-80 330 q120 -70 260 -30 q130 40 240 -10 q120 -54 250 -6 q140 52 270 4 q120 -44 240 6 q110 44 240 -8 q120 -48 240 -4 q100 36 190 -8 v120 h-1930 z"/>
    <path d="M-60 470 q140 -60 290 -24 q140 34 270 -14 q120 -44 250 -2 q130 42 270 -6 q110 -38 240 2 q120 38 250 -8 q110 -38 240 0 q110 32 220 -6 v110 h-2030 z" fill="#0a1a38" opacity="0.9"/>
  </g>

  <!-- golden aura burst behind the figure -->
  <circle cx="1150" cy="330" r="300" fill="url(#aura)" filter="url(#blur)"/>
  <g stroke="#ffd75e" stroke-opacity="0.35" stroke-width="2" fill="none">
    <path d="M1150 90 v60"/>
    <path d="M990 170 l38 46"/>
    <path d="M1310 170 l-38 46"/>
    <path d="M950 300 l56 16"/>
    <path d="M1340 300 l-56 16"/>
  </g>

  <!-- ascending energy particles -->
  <g fill="#ffd75e">
    <circle cx="1090" cy="250" r="2.4"><animate attributeName="cy" values="420;140;420" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="1210" cy="200" r="2"><animate attributeName="cy" values="400;120;400" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="1130" cy="300" r="1.8"><animate attributeName="cy" values="460;160;460" dur="5.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.85;0" dur="5.4s" repeatCount="indefinite"/></circle>
    <circle cx="1190" cy="280" r="2.2"><animate attributeName="cy" values="440;150;440" dur="6.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="6.6s" repeatCount="indefinite"/></circle>
    <circle cx="1050" cy="350" r="1.5"><animate attributeName="cy" values="480;190;480" dur="7.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="7.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- flying figure silhouette -->
  <g transform="translate(1150 330)">
    <g fill="#071226">
      <path d="M-8 -52 q14 -26 34 -14 q-2 16 -16 26 q-14 10 -18 4 z"/>        <!-- raised arm -->
      <path d="M6 -40 q26 -10 44 8 q14 16 4 34 l-20 8 q-16 -18 -28 -42 z"/>  <!-- cape/trailing cloth -->
      <ellipse cx="4" cy="-16" rx="16" ry="20"/>                              <!-- head -->
      <path d="M-12 -8 q10 26 30 30 l34 8 q-8 18 -26 22 q-22 -4 -30 -20 q-8 14 -22 12 q-14 -2 -14 -16 q-4 12 -18 6 q-12 -6 -8 -20 q-4 -8 4 -12 z"/> <!-- torso + legs -->
    </g>
    <path d="M-6 -60 q10 -16 22 -4" stroke="#ffd75e" stroke-width="2" fill="none" opacity="0.9"/>
    <circle cx="2" cy="-30" r="44" fill="#ffe9a8" opacity="0.12" filter="url(#soft)"/>
  </g>

  <!-- dragon coiling through the clouds (left) -->
  <g transform="translate(120 620)" fill="none">
    <ellipse cx="560" cy="-20" rx="320" ry="260" fill="url(#dragonGlow)" filter="url(#blur)"/>
    <path d="M-140 -160 q80 -90 170 -40 q70 40 40 110 q-26 60 -100 60 q-80 0 -80 -70 q0 -80 110 -90 q130 -12 180 70 q40 66 -20 120 q-60 52 -130 20 q-80 -36 -70 -120 q12 -104 140 -110 q150 -6 190 90 q30 72 -30 120"
      stroke="#f7d57a" stroke-width="16" stroke-linecap="round" opacity="0.9"/>
    <path d="M-140 -160 q80 -90 170 -40 q70 40 40 110 q-26 60 -100 60 q-80 0 -80 -70 q0 -80 110 -90 q130 -12 180 70 q40 66 -20 120 q-60 52 -130 20 q-80 -36 -70 -120 q12 -104 140 -110 q150 -6 190 90 q30 72 -30 120"
      stroke="#fff3c4" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
    <path d="M-140 -160 q80 -90 170 -40" stroke="#ffefad" stroke-width="20" stroke-linecap="round" opacity="0.95"/>
    <!-- horns + whiskers -->
    <path d="M-112 -208 q-10 -34 14 -50 q24 -16 44 2 q18 16 8 42 q-10 26 -40 26 q-26 0 -26 -20 z" fill="#f7d57a" opacity="0.95"/>
    <path d="M-140 -170 q-34 -4 -50 -24 M-128 -182 q-26 -18 -30 -46" stroke="#f7d57a" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- mountain ridges -->
  <g fill="url(#mountain)" opacity="0.95">
    <path d="M0 900 L240 640 L420 760 L620 600 L820 740 L1010 630 L1220 770 L1420 660 L1600 760 V900 Z"/>
  </g>
  <path d="M0 900 L240 640 L420 760 L620 600 L820 740 L1010 630 L1220 770 L1420 660 L1600 760 V900 Z" fill="none" stroke="#3f7fce" stroke-opacity="0.25" stroke-width="2"/>
</svg>
