<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#170b02"/>
      <stop offset="0.45" stop-color="#4a2307"/>
      <stop offset="0.78" stop-color="#b05c0e"/>
      <stop offset="1" stop-color="#f5911e"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe3a3" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#ffb347" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="villageGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff9a2e" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ff9a2e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="land" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1003"/>
      <stop offset="1" stop-color="#120500"/>
    </linearGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb84d"/>
      <stop offset="1" stop-color="#e0690d"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- sun -->
  <circle cx="1180" cy="470" r="230" fill="#ff7a1a" opacity="0.16" filter="url(#blur)"/>
  <circle cx="1180" cy="470" r="120" fill="url(#sun)"/>
  <circle cx="1180" cy="470" r="80" fill="#ffe9c2" opacity="0.92"/>

  <!-- whirlpool emblem spiral (Uzumaki crest, top-left) -->
  <g transform="translate(210 190)" opacity="0.4">
    <g fill="none" stroke="#ffc46b" stroke-width="9" stroke-linecap="round">
      <path d="M0 0 A55 55 0 0 1 55 55 A65 65 0 0 1 -10 65 A48 48 0 0 1 -10 -31 A38 38 0 0 1 28 7 A24 24 0 0 1 -4 22 A14 14 0 0 1 -10 2"/>
    </g>
    <circle cx="0" cy="0" r="92" fill="none" stroke="#ffc46b" stroke-width="3" opacity="0.5"/>
  </g>

  <!-- cloud bands -->
  <g fill="#2b1003" opacity="0.55">
    <ellipse cx="330" cy="300" rx="240" ry="13"/>
    <ellipse cx="760" cy="250" rx="180" ry="10"/>
    <ellipse cx="1360" cy="300" rx="200" ry="12"/>
    <ellipse cx="980" cy="380" rx="150" ry="9" opacity="0.5"/>
  </g>

  <!-- falling leaves -->
  <g fill="url(#leafGrad)">
    <g transform="translate(560 240) rotate(24)"><path d="M0 0 L10 -20 L0 20 L-10 -20 Z"/></g>
    <g transform="translate(700 320) rotate(-32)"><path d="M0 0 L10 -20 L0 20 L-10 -20 Z" opacity="0.9"/></g>
    <g transform="translate(880 200) rotate(50)"><path d="M0 0 L10 -20 L0 20 L-10 -20 Z" opacity="0.75"/></g>
    <g transform="translate(430 380) rotate(-14)"><path d="M0 0 L10 -20 L0 20 L-10 -20 Z" opacity="0.85"/></g>
    <g transform="translate(1020 330) rotate(66)"><path d="M0 0 L10 -20 L0 20 L-10 -20 Z" opacity="0.7"/></g>
    <g transform="translate(650 200) rotate(8)"><path d="M0 0 L10 -20 L0 20 L-10 -20 Z" opacity="0.95"/></g>
    <g transform="translate(1320 220) rotate(-40)"><path d="M0 0 L10 -20 L0 20 L-10 -20 Z" opacity="0.8"/></g>
  </g>

  <!-- distant forest ridge -->
  <path d="M0 640 q60 -30 130 -18 q90 18 160 -6 q80 -26 150 -10 q90 20 170 -6 q70 -24 150 -8 q90 18 170 -8 q80 -26 160 -6 q70 18 150 -4 q90 -24 160 -10 q60 12 120 -2 v80 h-1520 z" fill="#240e03" opacity="0.9"/>

  <!-- Hokage monument rock with carved faces -->
  <g fill="#1a0a01">
    <path d="M520 900 L610 430 L660 470 L690 420 L760 470 L800 430 L910 900 Z"/>
    <path d="M660 470 L690 420 L760 470 L800 430 L790 900 L640 900 Z" fill="#241003"/>
    <g fill="#0f0500" opacity="0.85">
      <!-- carved face profiles -->
      <path d="M660 560 q24 -70 52 -34 q6 10 -2 22 q10 8 2 18 q-8 12 -20 8 l-6 26 q-16 8 -26 -8 z"/>
      <path d="M706 570 q22 -64 50 -30 q7 10 -1 22 q10 8 2 18 q-8 12 -20 8 l-5 24 q-16 8 -26 -8 z"/>
      <path d="M752 560 q24 -66 50 -32 q7 10 -1 22 q10 8 2 18 q-8 12 -20 8 l-5 26 q-16 8 -26 -8 z"/>
    </g>
  </g>

  <!-- village skyline with pagoda roofs -->
  <g fill="#120500">
    <path d="M40 900 v-150 q40 -30 80 0 v150 z"/>
    <path d="M110 900 v-120 q-20 -24 20 -38 q40 14 20 38 v120 z"/>
    <path d="M170 900 v-90 h-30 v-24 h80 v24 h-30 v90 z"/>
    <path d="M960 900 v-140 h-36 v-26 h110 v26 h-36 v140 z"/>
    <path d="M1060 900 v-110 q-18 -22 24 -34 q42 12 24 34 v110 z"/>
    <path d="M1140 900 v-130 q34 -26 70 0 v130 z"/>
    <path d="M1260 900 v-100 h-30 v-22 h90 v22 h-30 v100 z"/>
    <path d="M1340 900 v-120 q-16 -20 22 -30 q38 10 22 30 v120 z"/>
  </g>

  <!-- warm window lights -->
  <g fill="#ffc46b" opacity="0.75">
    <rect x="52" y="770" width="8" height="12"/>
    <rect x="78" y="810" width="8" height="12"/>
    <rect x="124" y="800" width="8" height="12"/>
    <rect x="970" y="780" width="8" height="12"/>
    <rect x="998" y="800" width="8" height="12"/>
    <rect x="1074" y="806" width="8" height="12"/>
    <rect x="1154" y="792" width="8" height="12"/>
    <rect x="1270" y="818" width="8" height="12"/>
  </g>

  <!-- foreground ground -->
  <rect y="840" width="1600" height="60" fill="url(#land)"/>
</svg>
