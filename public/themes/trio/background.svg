<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#170b02"/>
      <stop offset="0.45" stop-color="#4a2307"/>
      <stop offset="0.78" stop-color="#b05c0e"/>
      <stop offset="1" stop-color="#f5911e"/>
    </linearGradient>
    <radialGradient id="glowRed" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5a2a" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ff5a2a" stop-opacity="0"/>
